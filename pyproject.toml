[project]
name = "arabic-diarized-transcribe"
version = "0.1.0"
description = "Speaker-labelled Arabic transcripts: pyannote diarization, then Cohere Transcribe Arabic per turn"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyannote.audio>=4.0,<5",
    "transformers>=5.4.0",
    "torch",
    "accelerate",
    "soundfile",
    "librosa",
    "sentencepiece",
    "protobuf",
    "python-dotenv",
    "requests",
]
